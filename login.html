<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login - Películas</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div id="login-container">
        <h2>Iniciar Sesión</h2>

        <input type="text" id="loginUser" placeholder="Usuario">
        <input type="password" id="loginPass" placeholder="Contraseña">

        <button id="btnLogin">Entrar</button>

        <p>
            ¿No tienes cuenta?
            <a href="#" id="mostrarRegistro">Crear cuenta</a>
        </p>
    </div>

    <div id="registro-container" style="display:none;">
        <h2>Crear Cuenta</h2>

        <input type="text" id="regUser" placeholder="Usuario nuevo">
        <input type="password" id="regPass" placeholder="Contraseña nueva">

        <button id="btnRegistrar">Registrarse</button>

        <p>
            ¿Ya tienes cuenta?
            <a href="#" id="mostrarLogin">Iniciar sesión</a>
        </p>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
